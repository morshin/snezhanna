<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--tg-theme-bg-color, #fff);
    padding-bottom: 4px;
  }

  .tabs {
    display: flex;
    padding: 12px 16px 8px;
    gap: 8px;
  }

  .project-bar {
    display: none;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .project-bar.visible {
    display: flex;
  }

  .project-bar::-webkit-scrollbar {
    display: none;
  }

  .project-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #000);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }

  .project-chip:active {
    opacity: 0.85;
  }

  .project-chip.active {
    background: var(--tg-theme-button-color, #3390ec);
    color: var(--tg-theme-button-text-color, #fff);
  }

  .tab {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-hint-color, #999);
  }

  .tab.active {
    background: var(--tg-theme-button-color, #3390ec);
    color: var(--tg-theme-button-text-color, #fff);
  }

  .section-header {
    padding: 4px 4px 6px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--tg-theme-hint-color, #999);
  }

  .quadrant-section {
    margin: 0 8px 10px;
    padding: 10px 8px 6px;
    border-radius: 14px;
  }

  .quadrant-section.q1 {
    background: rgba(211, 47, 47, 0.11);
  }

  .quadrant-section.q2 {
    background: rgba(245, 124, 0, 0.11);
  }

  .quadrant-section.q3 {
    background: rgba(25, 118, 210, 0.11);
  }

  .quadrant-section.q4 {
    background: rgba(100, 100, 100, 0.09);
  }

  .task-list {
    padding: 0 0 100px;
  }

  .task-row {
    display: flex;
    align-items: center;
    min-height: 52px;
    padding: 8px;
    margin: 2px 0;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    transition: transform 0.2s ease, opacity 0.3s ease;
  }

  .task-row:active {
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
  }

  .task-check {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--tg-theme-hint-color, #ccc);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-right: 12px;
  }

  .task-check.completing {
    border-color: var(--tg-theme-button-color, #3390ec);
    background: var(--tg-theme-button-color, #3390ec);
  }

  .task-check.completing::after {
    content: '';
    width: 10px;
    height: 6px;
    border-left: 2px solid var(--tg-theme-button-text-color, #fff);
    border-bottom: 2px solid var(--tg-theme-button-text-color, #fff);
    transform: rotate(-45deg);
    margin-bottom: 2px;
  }

  .task-content {
    flex: 1;
    min-width: 0;
  }

  .task-title {
    font-size: 15px;
    line-height: 1.3;
    word-break: break-word;
  }

  .task-meta {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999);
    margin-top: 2px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .task-meta .overdue { color: #e53935; }
  .task-meta .today { color: var(--tg-theme-button-color, #3390ec); }

  .task-flags {
    display: flex;
    gap: 4px;
    margin-right: 4px;
  }

  .flag {
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 600;
  }

  .flag.urgent { background: #ffebee; color: #c62828; }
  .flag.important { background: #e3f2fd; color: #1565c0; }

  .task-menu-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--tg-theme-hint-color, #999);
    cursor: pointer;
    border: none;
    background: none;
    flex-shrink: 0;
    border-radius: 50%;
  }

  .task-menu-btn:active {
    background: var(--tg-theme-secondary-bg-color, #eee);
  }

  /* Action sheet */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .action-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--tg-theme-bg-color, #fff);
    border-radius: 16px 16px 0 0;
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    padding: 8px 16px calc(env(safe-area-inset-bottom, 16px) + 8px);
    max-height: 70vh;
    overflow-y: auto;
  }

  .action-sheet.visible { transform: translateY(0); }

  .action-sheet .handle {
    width: 36px;
    height: 4px;
    background: var(--tg-theme-hint-color, #ccc);
    border-radius: 2px;
    margin: 4px auto 12px;
  }

  .action-sheet .sheet-title {
    font-size: 14px;
    font-weight: 600;
    padding: 4px 0 12px;
    text-align: center;
    color: var(--tg-theme-hint-color, #999);
  }

  .action-btn {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 4px;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--tg-theme-text-color, #000);
    cursor: pointer;
    gap: 12px;
    border-radius: 8px;
  }

  .action-btn:active { background: var(--tg-theme-secondary-bg-color, #f5f5f5); }
  .action-btn.danger { color: #e53935; }
  .action-btn .icon { font-size: 20px; width: 28px; text-align: center; }

  /* Priority toggles in sheet */
  .priority-row {
    display: flex;
    gap: 8px;
    padding: 8px 0 12px;
  }

  .priority-toggle {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
    background: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--tg-theme-text-color, #000);
    transition: all 0.15s;
  }

  .priority-toggle.on {
    border-color: var(--tg-theme-button-color, #3390ec);
    background: var(--tg-theme-button-color, #3390ec);
    color: var(--tg-theme-button-text-color, #fff);
  }

  /* Date picker */
  .date-input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 2px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
    border-radius: 10px;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    margin: 8px 0;
  }

  /* Snackbar */
  .snackbar {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
    left: 16px;
    right: 16px;
    background: var(--tg-theme-text-color, #333);
    color: var(--tg-theme-bg-color, #fff);
    padding: 14px 16px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 200;
    font-size: 14px;
    transform: translateY(120%);
    transition: transform 0.25s ease;
  }

  .snackbar.visible { transform: translateY(0); }

  .snackbar button {
    background: none;
    border: none;
    color: var(--tg-theme-button-color, #3390ec);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    text-align: center;
  }

  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state .text { font-size: 16px; color: var(--tg-theme-hint-color, #999); }

  /* Loading */
  .loading {
    display: flex;
    justify-content: center;
    padding: 60px 0;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
    border-top-color: var(--tg-theme-button-color, #3390ec);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .task-row.removing {
    opacity: 0;
    transform: translateX(-100%);
    transition: opacity 0.3s, transform 0.3s;
  }
</style>
</head>
<body>

<div class="sticky-header">
  <div class="tabs">
    <button class="tab active" data-filter="today">Today</button>
    <button class="tab" data-filter="all">All</button>
  </div>
  <div class="project-bar" id="projectBar" aria-label="Filter by project"></div>
</div>

<div id="content">
  <div class="loading"><div class="spinner"></div></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="action-sheet" id="actionSheet">
  <div class="handle"></div>
  <div id="sheetContent"></div>
</div>

<div class="snackbar" id="snackbar">
  <span id="snackbarText"></span>
  <button id="snackbarAction"></button>
</div>

<script>
(function() {
  'use strict';

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const API_BASE = '';
  const initData = tg ? tg.initData : '';

  let currentFilter = 'today';
  let selectedProject = null;
  let allTasks = [];
  let undoTimer = null;
  let undoTask = null;
  let activeSheetTaskId = null;

  // ── API ───────────────────────────────────────────────────────────────────

  async function api(method, path, body) {
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        'X-Init-Data': initData
      }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    return res.json();
  }

  async function loadTasks() {
    const pb = document.getElementById('projectBar');
    pb.classList.remove('visible');
    pb.innerHTML = '';
    const data = await api('GET', `/api/tasks?filter=${currentFilter}`);
    allTasks = data.tasks || [];
    render();
  }

  // ── Rendering ─────────────────────────────────────────────────────────────

  const QUADRANT_LABELS = {
    1: 'Urgent & Important',
    2: 'Urgent',
    3: 'Important',
    4: 'Backlog'
  };

  function quadrant(t) {
    if (t.urgent && t.important) return 1;
    if (t.urgent && !t.important) return 2;
    if (!t.urgent && t.important) return 3;
    return 4;
  }

  function formatDue(dateStr) {
    if (!dateStr) return null;
    const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Madrid' });
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toLocaleDateString('sv-SE', { timeZone: 'Europe/Madrid' });

    if (dateStr < today) return { text: dateStr, cls: 'overdue' };
    if (dateStr === today) return { text: 'today', cls: 'today' };
    if (dateStr === tomorrowStr) return { text: 'tomorrow', cls: '' };
    return { text: dateStr, cls: '' };
  }

  function render() {
    const content = document.getElementById('content');
    const projectBar = document.getElementById('projectBar');
    const active = allTasks.filter(t => t.status !== 'done' && t.status !== 'cancelled');

    const projectNames = [...new Set(active.map(t => t.project).filter(Boolean))].sort((a, b) =>
      a.localeCompare(b, undefined, { sensitivity: 'base' })
    );

    if (selectedProject && !projectNames.includes(selectedProject)) {
      selectedProject = null;
    }

    if (projectNames.length === 0) {
      projectBar.classList.remove('visible');
      projectBar.innerHTML = '';
    } else {
      projectBar.classList.add('visible');
      let chips =
        `<button type="button" class="project-chip${selectedProject === null ? ' active' : ''}" data-project="__all__">All projects</button>`;
      for (const p of projectNames) {
        const activeCls = selectedProject === p ? ' active' : '';
        chips += `<button type="button" class="project-chip${activeCls}" data-project="${escAttr(p)}">${esc(p)}</button>`;
      }
      projectBar.innerHTML = chips;
    }

    if (active.length === 0) {
      content.innerHTML =
        '<div class="empty-state"><div class="emoji">&#127881;</div><div class="text">All done!</div></div>';
      return;
    }

    const filtered = selectedProject
      ? active.filter(t => t.project === selectedProject)
      : active;

    if (filtered.length === 0) {
      content.innerHTML =
        '<div class="empty-state"><div class="emoji">&#128193;</div><div class="text">No tasks in this project</div></div>';
      return;
    }

    const groups = {};
    for (const t of filtered) {
      const q = quadrant(t);
      if (!groups[q]) groups[q] = [];
      groups[q].push(t);
    }

    let html = '<div class="task-list">';
    for (const q of [1, 2, 3, 4]) {
      if (!groups[q]) continue;
      html += `<div class="quadrant-section q${q}">`;
      html += `<div class="section-header">${QUADRANT_LABELS[q]}</div>`;
      for (const t of groups[q]) {
        const due = formatDue(t.due_date);
        html += `
          <div class="task-row" data-id="${t.id}">
            <div class="task-check" data-id="${t.id}"></div>
            <div class="task-content">
              <div class="task-title">${esc(t.title)}</div>
              <div class="task-meta">
                ${t.project ? `<span>${esc(t.project)}</span>` : ''}
                ${due ? `<span class="${due.cls}">${due.text}</span>` : ''}
              </div>
            </div>
            <button class="task-menu-btn" data-id="${t.id}">&ctdot;</button>
          </div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    content.innerHTML = html;
  }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escAttr(s) {
    if (!s) return '';
    return s
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Actions ───────────────────────────────────────────────────────────────

  async function completeTask(id) {
    const row = document.querySelector(`.task-row[data-id="${id}"]`);
    const check = row && row.querySelector('.task-check');
    if (check) check.classList.add('completing');

    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    setTimeout(async () => {
      if (row) row.classList.add('removing');
      setTimeout(async () => {
        await api('POST', `/api/tasks/${id}/complete`);
        allTasks = allTasks.filter(t => t.id !== id);
        render();
      }, 300);
    }, 200);
  }

  async function deleteTask(id) {
    const task = allTasks.find(t => t.id === id);
    if (!task) return;

    // Optimistic removal
    allTasks = allTasks.filter(t => t.id !== id);
    render();
    closeSheet();

    // Show undo snackbar
    undoTask = task;
    showSnackbar('Task deleted', 'Undo', () => {
      // Undo: re-add to local list and re-render (task not deleted on server yet)
      clearTimeout(undoTimer);
      allTasks.push(undoTask);
      allTasks = sortTasks(allTasks);
      undoTask = null;
      render();
      hideSnackbar();
    });

    // Actually delete after 3 seconds
    undoTimer = setTimeout(async () => {
      await api('DELETE', `/api/tasks/${id}`);
      undoTask = null;
      hideSnackbar();
    }, 3000);
  }

  async function updatePriority(id, urgent, important) {
    await api('PATCH', `/api/tasks/${id}`, { urgent, important });
    const t = allTasks.find(t => t.id === id);
    if (t) {
      t.urgent = urgent;
      t.important = important;
    }
    allTasks = sortTasks(allTasks);
    render();
  }

  async function updateDueDate(id, dueDate) {
    await api('PATCH', `/api/tasks/${id}`, { due_date: dueDate || null });
    const t = allTasks.find(t => t.id === id);
    if (t) t.due_date = dueDate || null;
    render();
    closeSheet();
  }

  function sortTasks(tasks) {
    return [...tasks].sort((a, b) => quadrant(a) - quadrant(b));
  }

  // ── Action Sheet ──────────────────────────────────────────────────────────

  function openSheet(taskId) {
    activeSheetTaskId = taskId;
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;

    const sheet = document.getElementById('sheetContent');
    sheet.innerHTML = `
      <div class="sheet-title">${esc(task.title)}</div>
      <div class="priority-row">
        <button class="priority-toggle ${task.urgent ? 'on' : ''}" id="toggleUrgent">Urgent</button>
        <button class="priority-toggle ${task.important ? 'on' : ''}" id="toggleImportant">Important</button>
      </div>
      <button class="action-btn" id="btnDeadline">
        <span class="icon">&#128197;</span>
        <span>${task.due_date ? 'Change deadline' : 'Set deadline'}</span>
      </button>
      <button class="action-btn danger" id="btnDelete">
        <span class="icon">&#128465;</span>
        <span>Delete</span>
      </button>
    `;

    document.getElementById('overlay').classList.add('visible');
    document.getElementById('actionSheet').classList.add('visible');

    // Priority toggles
    document.getElementById('toggleUrgent').onclick = () => {
      const newUrgent = !task.urgent;
      task.urgent = newUrgent;
      document.getElementById('toggleUrgent').classList.toggle('on', newUrgent);
      updatePriority(taskId, newUrgent, task.important);
    };

    document.getElementById('toggleImportant').onclick = () => {
      const newImportant = !task.important;
      task.important = newImportant;
      document.getElementById('toggleImportant').classList.toggle('on', newImportant);
      updatePriority(taskId, task.urgent, newImportant);
    };

    // Deadline
    document.getElementById('btnDeadline').onclick = () => {
      const sheet = document.getElementById('sheetContent');
      sheet.innerHTML = `
        <div class="sheet-title">Set deadline</div>
        <input type="date" class="date-input" id="datePicker" value="${task.due_date || ''}">
        <button class="action-btn" id="btnSaveDate">
          <span class="icon">&#10003;</span>
          <span>Save</span>
        </button>
        <button class="action-btn" id="btnClearDate">
          <span class="icon">&#10005;</span>
          <span>Remove deadline</span>
        </button>
      `;
      document.getElementById('btnSaveDate').onclick = () => {
        updateDueDate(taskId, document.getElementById('datePicker').value);
      };
      document.getElementById('btnClearDate').onclick = () => {
        updateDueDate(taskId, null);
      };
    };

    // Delete
    document.getElementById('btnDelete').onclick = () => {
      deleteTask(taskId);
    };
  }

  function closeSheet() {
    document.getElementById('overlay').classList.remove('visible');
    document.getElementById('actionSheet').classList.remove('visible');
    activeSheetTaskId = null;
  }

  // ── Snackbar ──────────────────────────────────────────────────────────────

  function showSnackbar(text, actionLabel, actionFn) {
    document.getElementById('snackbarText').textContent = text;
    const btn = document.getElementById('snackbarAction');
    btn.textContent = actionLabel;
    btn.onclick = actionFn;
    document.getElementById('snackbar').classList.add('visible');
  }

  function hideSnackbar() {
    document.getElementById('snackbar').classList.remove('visible');
  }

  // ── Event Listeners ───────────────────────────────────────────────────────

  document.getElementById('projectBar').addEventListener('click', (e) => {
    const chip = e.target.closest('.project-chip');
    if (!chip) return;
    const p = chip.dataset.project;
    selectedProject = p === '__all__' || p === undefined ? null : p;
    render();
  });

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      loadTasks();
    });
  });

  // Task interactions (delegated)
  document.getElementById('content').addEventListener('click', (e) => {
    const check = e.target.closest('.task-check');
    if (check) {
      completeTask(Number(check.dataset.id));
      return;
    }

    const menuBtn = e.target.closest('.task-menu-btn');
    if (menuBtn) {
      openSheet(Number(menuBtn.dataset.id));
      return;
    }
  });

  // Overlay click to close sheet
  document.getElementById('overlay').addEventListener('click', closeSheet);

  // ── Init ──────────────────────────────────────────────────────────────────

  loadTasks();

})();
</script>
</body>
</html>
